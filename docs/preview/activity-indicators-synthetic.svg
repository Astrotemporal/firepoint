<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic-only map activity indicator policy preview</title>
  <desc id="desc">Synthetic diagram showing grey private sketch, yellow crowdsourced report activity, and red official active indicator as fixed-size hollow circles with different meanings.</desc>
  <rect width="720" height="320" fill="#f8fafc"/>
  <text x="24" y="38" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">SYNTHETIC TEST-ONLY indicator policy preview</text>
  <text x="24" y="66" font-family="system-ui, sans-serif" font-size="14" fill="#334155">Not live data. Not a fire perimeter, evacuation zone, route input, or app fallback.</text>
  <g transform="translate(80 155)">
    <circle cx="0" cy="0" r="34" fill="#6b7280" fill-opacity="0.07" stroke="#5b6470" stroke-width="4" stroke-dasharray="8 8"/>
    <text x="0" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#111827">Grey</text>
    <text x="0" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#374151">private sketch</text>
  </g>
  <g transform="translate(330 155)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#facc15" stroke-width="5"/>
    <text x="0" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#111827">Yellow</text>
    <text x="0" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#374151">moderated unverified aggregate</text>
    <text x="0" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#374151">3+ approved reports/cell</text>
  </g>
  <g transform="translate(590 155)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#dc2626" stroke-width="5"/>
    <text x="0" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#111827">Red</text>
    <text x="0" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#374151">official active source only</text>
  </g>
</svg>
