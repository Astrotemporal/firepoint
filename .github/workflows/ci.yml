name: Firepoint checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Loopback-only: a synthetic stub stands in for the Glendale GIS MCP. No hosted
      # MCP, Vercel, or real key is contacted; a production build must stay paused.
      - run: npm run gis:smoke
        timeout-minutes: 8
