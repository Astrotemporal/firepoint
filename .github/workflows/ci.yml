name: Firepoint checks

on:
  pull_request:
  push:
    branches: [main, staging/source-backed]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Loopback-only: a synthetic stub stands in for the Glendale GIS MCP. No hosted
      # MCP, Vercel, or real key is contacted; a production build must stay paused.
      - run: npm run gis:smoke
        timeout-minutes: 8

  public-gate-smoke:
    # A production build (NODE_ENV=production) must serve the public homepage even with the prototype flag set.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start the production server with the prototype flag set (it must be ignored)
        run: FIREPOINT_PROTOTYPE_ROUTING=enabled npm run start -- --port 3000 > /tmp/firepoint-smoke.log 2>&1 &
      - run: node scripts/smoke-public-home.mjs

  source-sql-integrity:
    # Disposable synthetic PostgreSQL only; no application DB or hosted feed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      source_postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: synthetic-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply draft source migrations to disposable Postgres
        run: |
          docker exec -i "${{ job.services.source_postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < db/migrations/0100_source_snapshots.sql
          docker exec -i "${{ job.services.source_postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < db/migrations/0101_source_scope_integrity.sql
      - name: Reject synthetic cross-scope, stale, retroactive, and rewrite attempts
        run: docker exec -i "${{ job.services.source_postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < db/tests/source-scope-integrity.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Concurrent complete-generation serialization
        run: node db/tests/source-scope-concurrency.mjs "${{ job.services.source_postgres.id }}"
