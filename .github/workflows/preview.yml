name: Refresh app preview

on:
  pull_request:
  push:
    branches: [main, staging/source-backed]
  workflow_dispatch:

# Captures are read-only artifacts. Newer runs cancel older ones for the same ref.
concurrency:
  group: firepoint-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start the local app
        run: npm run start -- --port 3000 > /tmp/firepoint-preview.log 2>&1 &
      - name: Capture static UI (no live feed or tile request)
        run: node scripts/capture-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firepoint-preview
          path: docs/preview/*.png
          if-no-files-found: ignore
          retention-days: 14
